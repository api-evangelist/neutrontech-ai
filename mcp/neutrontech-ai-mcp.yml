name: NeutronTech blog MCP (WordPress.com MCP adapter)
summary: 'NeutronTech serves no MCP server for its products. Its blog, blog.neutrontech.ai, is a WordPress.com-hosted
  site (wpcomsh, Jetpack and wpcom namespaces in the REST index) whose REST API carries the WordPress MCP adapter:
  two MCP routes under /wp-json/mcp/. The OAuth-protected route answers an anonymous POST initialize with HTTP 401,
  code mcp_unauthorized, and a WWW-Authenticate: Bearer header whose resource_metadata points at
  https://blog.neutrontech.ai/.well-known/oauth-protected-resource; that document (saved under well-known/) names
  the route as its resource, lists blog.neutrontech.ai as the authorization server and advertises the single scope
  `mcp`. The default-adapter route answers 401 rest_forbidden, gated by WordPress authentication. Neither route
  could be introspected anonymously, so the tool list is unknown. Recorded because it is a real, reachable,
  OAuth-gated MCP surface on a NeutronTech host -- not because NeutronTech authored it, and not because it reaches
  Hubyn, Neutron Studio or Neutron Health, none of which publishes an API.'
